# Experiment 001: Baseline U-Net Training
# ========================================

experiment:
  name: "exp_001_baseline"
  description: "Baseline U-Net training with default hyperparameters"
  date: "2026-XX-XX"
  author: "Person 4"

model:
  architecture: "unet"
  encoder: "resnet18"  # or custom encoder
  num_classes: 5  # background + 4 object classes (adjust as needed)
  input_size: [256, 256]
  pretrained_encoder: false

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 0.0001
  scheduler: "step"
  scheduler_step_size: 10
  scheduler_gamma: 0.5
  loss_function: "cross_entropy"  # or "dice_loss", "combined"

data:
  dataset_path: "../../../resources/datasets/office_segmentation/"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: 15  # degrees
    color_jitter: true
    normalize: true

hardware:
  device: "cuda"  # or "cpu"
  num_workers: 4
  pin_memory: true

logging:
  save_dir: "./"
  save_interval: 5  # save checkpoint every N epochs
  log_interval: 10  # log metrics every N batches
